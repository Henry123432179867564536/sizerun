<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#EDEDE8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121417" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Desk">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Sizemill Desk</title>
<script>
  // Keep one address for Desk: /desk (which Vercel's cleanUrls also serves) becomes /desk/.
  // The page's own files use root-absolute /desk/ paths, so the browser's preload scanner,
  // which fetches them before this runs, gets the right files either way.
  if (/\/desk$/i.test(location.pathname)) location.replace(location.pathname + '/' + location.search + location.hash);
</script>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231B2028'/%3E%3Ccircle cx='16' cy='16' r='6.5' fill='%23EDEDE8'/%3E%3C/svg%3E">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"
      integrity="sha512-h9FcoyWjHcOcmEVkxOfTLnmZFWIH0iZhZT1H2TbOq55xssQGEJHEaIm+PgoUaZbRvQTNTluNOEfb1ZRy6D3BOw=="
      crossorigin="anonymous" referrerpolicy="no-referrer">
<link rel="stylesheet" href="/desk/desk.css">

<!-- Classic scripts with defer run in order before the module below, so app.js can rely on
     the globals `L` and `supabase`. -->
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"
        integrity="sha512-puJW3E/qXDqYp9IfhAI54BJEaWIfloJ7JWs7OeD5i6ruC9JZL1gERT1wjtwXFlh7CjE7ZJ+/vcRZRkIYIb6p4g=="
        crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"
        integrity="sha384-GFr3yTh5lJznCbZfpTtXnwboFsxqtTQoeTZCRHhE0579KrRmlCzen5AA8ohaB5ug"
        crossorigin="anonymous"></script>
<!-- A module script fires `error` when any module in its static graph fails to load
     (e.g. the Preact CDN is unreachable): swap the boot screen for a reload prompt. -->
<script type="module" src="/desk/app.js" onerror="document.getElementById('boot').dataset.state='failed'"></script>
</head>
<body>
<div id="app">
  <div class="boot" id="boot" data-state="loading">
    <span class="brand-mark boot-mark" aria-hidden="true"></span>
    <p class="boot-loading" role="status">Loading Desk…</p>
    <div class="boot-failed" role="alert">
      <p><strong>Desk couldn't load.</strong></p>
      <p>Check your connection, then <a href="">reload the page</a>.</p>
    </div>
    <noscript><p>Desk needs JavaScript turned on.</p></noscript>
  </div>
</div>
<script>
  // Boot in the business's own brand (lib/brand.js caches it; ?local=1 has its own key), so
  // the Sizemill mark never flashes before a custom logo, colour or name.
  try {
    var bk = /[?&]local=1(&|$)/.test(location.search) ? 'sizemill.desk.brand.local' : 'sizemill.desk.brand';
    var bb = JSON.parse(localStorage.getItem(bk) || 'null') || {};
    var bm = document.querySelector('.boot-mark');
    var bn = typeof bb.name === 'string' ? bb.name.trim() : '';
    var bl = typeof bb.logo_url === 'string' ? bb.logo_url.split('#')[0] : '';
    if (/^#[0-9a-f]{6}$/i.test(bb.background_color || '') && !matchMedia('(prefers-color-scheme: dark)').matches) {
      document.documentElement.style.setProperty('--paper', bb.background_color);
    }
    if (/^#[0-9a-f]{6}$/i.test(bb.brand_color || '')) {
      var bh = parseInt(bb.brand_color.slice(1), 16);
      bm.style.background = bb.brand_color;
      bm.style.color = 0.299 * (bh >> 16) + 0.587 * ((bh >> 8) & 255) + 0.114 * (bh & 255) > 150 ? '#111418' : '#fff';
    }
    if (/^(https:\/\/|data:image\/(png|jpeg|webp);base64,)/i.test(bl)) {
      var bi = new Image(); bi.className = 'boot-logo'; bi.alt = ''; bi.src = bl; bm.replaceWith(bi);
    } else if (bn) {
      bm.textContent = bn.charAt(0).toUpperCase(); bm.classList.add('boot-mono');
    }
    if (bn) { document.title = bn; document.querySelector('.boot-loading').textContent = 'Loading ' + bn + '\u2026'; }
  } catch (e) { /* no cache, or storage blocked: the default boot screen stays */ }
</script>
</body>
</html>
